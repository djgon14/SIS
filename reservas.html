<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas de Ambientes por Horas - Colegio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Colegio Don Bosco - Sistema de Reservas</div>
        <button id="login-btn" class="login-btn">Cerrar Sesión 🚪</button>
    </header>
    <div class="main-container">
        <div class="calendar-container">
            <div class="header">
                <button id="prev-btn">◀ Anterior</button>
                <h1 id="month-year-title"></h1>
                <button id="next-btn">Siguiente ▶</button>
            </div>
            <div class="weekdays">
                <div>Lunes</div><div>Martes</div><div>Miércoles</div><div>Jueves</div><div>Viernes</div><div>Sábado</div><div>Domingo</div>
            </div>
            <div id="days-container" class="days-grid"></div>
        </div>
        <div class="booking-panel" id="booking-panel">
            <h3>Gestión de Reserva</h3>
            <p id="selected-date-text" class="status-title">Selecciona un día del calendario</p>
            <div id="hours-section" class="hidden">
                <label>Horarios del Día:</label>
                <div id="hours-grid" class="hours-grid"></div>
            </div>
            <div id="booking-form" class="hidden">
                <h4 id="selected-hour-text" class="selected-hour-title"></h4>
                <label for="booking-environment">Ambiente:</label>
                <select id="booking-environment">
                    <option value="">Selecciona un ambiente</option>
                    <option value="Cancha 1">Cancha 1</option><option value="Cancha 2">Cancha 2</option><option value="Coliseo">Coliseo</option><option value="Teatro">Teatro</option><option value="Templo">Templo</option><option value="Laboratorio">Laboratorio</option><option value="Audiovisual">Audiovisual</option><option value="Curso 1">Curso 1</option><option value="Curso 2">Curso 2</option>
                </select>
                <label for="user-fullname">Nombre Completo:</label>
                <input type="text" id="user-fullname" placeholder="Ej. Juan Pérez">
                <label for="user-email">Correo Electrónico:</label>
                <input type="email" id="user-email" placeholder="Ej. juan@colegio.edu">
                <label for="user-phone">Número de Celular:</label>
                <input type="tel" id="user-phone" placeholder="Ej. 71234567">
                <label for="booking-reason">Motivo de la Reserva:</label>
                <textarea id="booking-reason" rows="2" placeholder="Ej. Laboratorio de Química"></textarea>
                <button id="save-booking-btn">Confirmar Horario</button>
                <button id="delete-booking-btn" class="danger-btn hidden">Liberar este Horario</button>
            </div>
        </div>
        <div class="history-panel">
            <div class="history-header">
                <h3>Lista Global de Reservas Registradas</h3>
                <button id="edit-mode-btn" class="clear-btn">✏️ Editar reservas</button>
            </div>
            <div id="edit-message" class="edit-message hidden">Selecciona una reserva y presiona <strong>Editar</strong> para modificarla.</div>
            <div id="reservations-list" class="reservations-list"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
