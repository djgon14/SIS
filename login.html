<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Colegio Don Bosco</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="logo-container">
            <img src="logo.png" alt="Logo Colegio Don Bosco">
        </div>
        <h1>Colegio Don Bosco</h1>
        <h2>Sistema de Reservas</h2>
        <form id="login-form">
            <div class="input-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Ingresa tu usuario" autocomplete="username" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
            </div>
            <p id="error-message" class="error-message"></p>
            <button type="submit" class="login-button">Iniciar Sesión</button>
        </form>
        <a href="carrusel.html" class="back-button">← Volver al inicio</a>
    </div>
    <script src="login.js"></script>
</body>
</html>
